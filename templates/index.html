<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OceanCast — AI Fish Predictor</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow-orb orb1"></div>
  <div class="glow-orb orb2"></div>

  <header>
    <div class="logo">🌊 OceanCast</div>
    <p class="tagline">AI-powered marine fish prediction</p>
  </header>

  <main>
    <section class="form-card">
      <h2>Ocean Parameters</h2>
      <div class="form-grid">
        <div class="field">
          <label>Chlorophyll <span class="unit">mg/m³</span></label>
          <input type="number" id="chlorophyll" step="0.01" placeholder="0.45" required>
        </div>
        <div class="field">
          <label>Sea Surface Temp <span class="unit">°C</span></label>
          <input type="number" id="sst" step="0.1" placeholder="28.5" required>
        </div>
        <div class="field">
          <label>Sea Surface Height <span class="unit">m</span></label>
          <input type="number" id="ssh" step="0.01" placeholder="0.12" required>
        </div>
        <div class="field">
          <label>Salinity <span class="unit">PSU</span></label>
          <input type="number" id="salinity" step="0.1" placeholder="34.2" required>
        </div>
        <div class="field">
          <label>Month</label>
          <select id="month">
            <option value="1">January</option><option value="2">February</option>
            <option value="3">March</option><option value="4">April</option>
            <option value="5">May</option><option value="6">June</option>
            <option value="7">July</option><option value="8">August</option>
            <option value="9">September</option><option value="10">October</option>
            <option value="11">November</option><option value="12">December</option>
          </select>
        </div>
        <div class="field">
          <label>Location Zone</label>
          <select id="location">
  <option value="Kochi">Kochi</option>
  <option value="Chennai">Chennai</option>
  <option value="Mumbai">Mumbai</option>
  <option value="Visakhapatnam">Visakhapatnam</option>
  <option value="Mangalore">Mangalore</option>
  <option value="Surat">Surat</option>

</select>
        </div>
      </div>
      <button id="predict-btn" onclick="predict()">
        <span class="btn-text">Predict Fish</span>
        <span class="btn-icon">→</span>
      </button>
    </section>

    <section class="results-card" id="results" style="display:none">
      <h2>Prediction Results</h2>
      <div id="loader" class="loader" style="display:none">
        <div class="wave-loader"><span></span><span></span><span></span><span></span><span></span></div>
        <p>Analyzing ocean data…</p>
      </div>
      <div id="fish-list"></div>
    </section>
  </main>

  <footer>Built with RandomForest · Powered by Flask</footer>
  <script src="/static/script.js"></script>
</body>
</html>
